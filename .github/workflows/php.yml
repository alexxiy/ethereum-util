name: PHP

on: ["push", "pull_request", "workflow_dispatch"]

jobs:
  build_and_test:
    name: Build and test ethereum-util with ${{ matrix.php-version }}
    strategy:
      matrix:
        # composer.json requires php ^8.1 (phpseclib 4)
        php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    runs-on: ubuntu-latest

    steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
          php-version: ${{ matrix.php-version }}

    - name: PHP version
      run: |
        php --version

    - uses: actions/checkout@v4

    - name: Validate composer.json
      run: composer validate

    # composer.lock is gitignored (this is a library), so the cache is keyed on composer.json
    # and dependencies are resolved per PHP version, picking the newest PHPUnit each supports.
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      if: steps.composer-cache.outputs.cache-hit != 'true'
      run: composer update --prefer-dist --no-progress

    - name: Run test suite
      run: vendor/bin/phpunit
